<!-- Permet l'affichage du contenu du site dans un navigateur via l'utilisation de balise -->



<!DOCTYPE html>
<html lang="fr-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustStreamIt</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../scripts/config.js" defer></script>
    <script src="../scripts/dataAPI.js" defer></script>
    <script src="../scripts/feedXML.js" defer></script>
    <script src="../scripts/init.js" defer></script>
    <script src="../scripts/main.js" defer></script>
</head>
<body>
    <div id="allContent">

        <header>
            <!-- Bannière  -->
            <div id="banner">
                <img id="logo" src="../image/logo.png" alt="logo JustStreamIt">
                <h1>Vidéos à la demande</h1>
            </div>
        </header>
        
        <main>

            <!-- Film ayant le meilleur score IMDB -->
            <section id="bestMovie">
                <h2>Meilleur film</h2>
                <div id="bestMovieFrame">
                    <div id="movieImage">
                        <img src="https://picsum.photos/360/480" alt="image">
                    </div>
                    <div id="movieContent">
                        <h2>titre film</h2>
                        <p>résumé film</p>
                        <button class="detailsButton detailsBestMovieButton" data-id="" >Détails</button>
                    </div>
                </div>
            </section>

            <!-- Categorie fixe films les mieux notés (tout genre) -->
            <section id="bestMovies">
                <h2>Films les mieux notés</h2>
                <div id="bestMoviesFrame" class="moviesFrame">
                </div>
                <button class="seeBtn" data-see="more" data-section="bestMovies">Voir plus</button>
            </section>

            <!-- Categorie fixe films les mieux notés (genre : Sci-Fi) -->
            <section id="firstCategory">
                <h2 class="hide">Première catégorie</h2>
            </section>

            <!-- Categorie fixe films les mieux notés (genre : Aventure) -->
            <section id="secondCategory">
                <h2 class="hide">Deuxième catégorie</h2>
            </section>
            
            <!-- Categorie choix du genre films les mieux notés -->
            <section id="otherCategory">
                <div id="categoryChoice">
                    <h2>Autres:</h2>
                    <!-- Menu déroulant -->
                        <select name="listCategory" id="listCategory">
                        </select>
                </div>
            </section>

        </main>

        <!-- Fenetre Modale -->
        <div id="modalWindowBackground"  class="hide">
            <div id="modalWindow" >
                <div class="headDetails">
                    <h2>Titre Film</h2>
                    <h3>Infos film</h3>
                </div>
                <div class="headDetails">
                    <p class="regular medium">Réalisé par :</p>
                    <p id="directors" class="light medium"></p>
                </div>
                <div>
                    <p class="light medium" id="summary"></p>
                </div>
                <div id="modalImage"><img src="https://picsum.photos/360/480" alt="image"></div>
                <div>
                    <p class="regular little">Avec :</p>
                    <p id="actors" class="light little"></p>
                </div>
                <button id="closeBtn">Fermer</button>
            </div>
        </div>

    </div>
    

</body>
</html>
