<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustStreamIt</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../scripts/script.js" defer></script>
</head>
<body>
    <header>
        
        <div class="banner">
            <img id="logo" src="../image/logo.png" alt="logo JustStreamIt">
            <h1>Vidéos à la demande</h1>
        </div>

    </header>
    
    <main>
        <section id="bestMovie">
            <h2>Meilleur film</h2>
            <div id="bestMovieFrame">
                <!-- Détails film : Image Titre synopsis bouton détails -->
                <div id="movieImage">
                    <img src="" alt="">
                </div>
                <div id="movieContent">
                    <h2></h2>
                    <p></p>
                    <button class="detailsButton" id="detailsRedButton">Détails</button>
                </div>
            </div>
        </section>


        <section id="bestMovies">
            <h2>Films les mieux notés</h2>
            <div id="bestMoviesFrame" class="moviesFrame">
                <!-- Détails film : Image Titre bouton détails -->
            </div>

            <button class="hide seeMore" id="seeBtn" >Voir plus</button>
        </section>


        <section id="firstCategory"></section>

        <section id="secondCategory"></section>


        
        <section id="otherCategory">
            
            <div id="categoryChoice">
                <h2>Autres:</h2>
                <!-- Menu déroulant -->
                    <select name="listCategory" id="listCategory">
                    </select>
            </div>


        </section>
    </main>


    <div class="modalWindowBackground hide">
        <div class="modalWindow" >
            <!-- Pop up -->
            <!-- Détails film : Image ; Titre ; Genres ; Date sortie ; Classification (10+ 18+); Score IMDB; Liste Acteurs ; Durée ; pays origine ; recette box office ; résumé film ; bouton fermer -->

            <div id="infos">
                <h2></h2>
                <h3></h3>
            </div>
            <div id="infos">
                <p class="regular medium">Réalisé par :</p>
                <p id="directors" class="light medium"></p>
            </div>
            <div id="infos">
                <p class="light medium" id="summary"></p>
            </div>
            <div id="poster"><img src="" alt=""></div>

            <div id="infos">
                <p class="regular little">Avec :</p>
                <p id="actors" class="light little"></p>
            </div>

            <button id="close">Fermer</button>
        </div>
    </div>

</body>
</html>
